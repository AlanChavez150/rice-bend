# Test scenario: Bessel (axicon) beam HITS the RX aperture (the fringe zone covers the window
# and spills past both edges)
# Twin of scenario_caustic_hit.yml: same scene, TX window, RX window, frequencies, noise and
# grid_search, so the axicon sits where the caustic plate does (x_center=-0.101, z=0.3) and its axis
# is steered onto the RX. Two things differ: the beam block, and gerchberg_saxton.max_iters (5000
# against 800; the single 300 GHz solve converges after 611 iterations, inside either cap). The
# sweep keeps its own 800 cap (gs_overrides).
# RX window: centered x=0, width 0.04 m. RX at z=0; TX projects -Z. TX width 0.072 m, height z=0.3.
# 300 GHz centre (ten-tone comb, 200-380 GHz); RX array at lambda/2 (80 elements, one fixed pitch
# for every tone); TX plate sampled at lambda/20 (1440 samples); 30 dB receiver noise.
# Verified (300 GHz): FWHM=0.0445 (> rx 0.04: for this beam it is the width of the fringe zone,
# which is now WIDER than the window), rx_peak/peak=1.000, energy_frac_in_rx=0.796 -> HIT. Six
# bright fringes rise above half the peak: five inside the window, 6.0-6.3 mm apart
# (lambda/(2*sin(5 deg)) = 5.73 mm, 6.05 mm on the RX plane under the 18.61 deg tilt), and a sixth
# just past its -x edge (-0.0204). They are near-equal (0.81-1.00 of the peak inside the window),
# so the reported beam_peak_x (+0.0001, the fringe on the axis) is just whichever one is marginally
# tallest. Across the comb: FWHM=0.0413, 0.808 at 200 GHz (three fringes, beam_peak_x=-0.0094);
# FWHM=0.0458, 0.787 at 380 GHz (seven fringes).
# Dense 64x48 grid_search (3072 candidate spots).

sim_scene:
  x_min: -0.3
  x_max: 0.3
  z_min: 0.0
  z_max: 0.85
  spacing: 0.00025

tx_aperture:
  x_min: -0.137
  x_max: -0.065
  z: 0.3
  dx: 0.0000499654         # lambda/20 at 300 GHz: int(width/dx) = 1440 samples across the plate
  beam:
    type: bessel
    cone_angle_deg: 5.0        # half-angle between the two crossing plane waves; fringe period 5.73 mm at 300 GHz
    steer_angle_deg: -18.61    # tilts the axis from the aperture centre (x=-0.101) onto the RX at x=0; negative steers toward +x

rx_aperture:
  x_center: 0.0
  width: 0.04
  dx: 0.000499654          # lambda/2 at 300 GHz (lambda = 0.999308 mm), a FIXED pitch in metres: one
                           # physical array for every tone. sampled_axis turns the nominal pitch
                           # into int(width/dx) = 80 elements across the window (realized 0.506 mm)

plot_path: scenario_bessel_hit.png

# Frequencies (Hz) the solvers run at. More than one means ONE JOINT solve: a single
# shared aperture profile fitted against every frequency at once (one delay
# plate whose phase scales with frequency; loss = mean of the per-frequency
# losses), written to one flat results/<run_name>/ with joint + per-frequency plots.
frequencies: [200.0e9, 220.0e9, 240.0e9, 260.0e9, 280.0e9, 300.0e9, 320.0e9, 340.0e9, 360.0e9, 380.0e9]

gerchberg_saxton:
  max_iters: 5000
  convergence_count: 10
  convergence_threshold: -1.0e-8
  lr0: 0.05
  bt_shrink: 0.5
  bt_tries: 8
  seed: 0
  history_stride: 50

output:
  output_dir: results
  run_name: scenario_bessel_hit
  save_run: true
  save_scene_fields: false
  save_gs_history: false

# Receiver noise on the simulated RX measurement (complex AWGN per RX element, one
# floor for all antennas and tones). Override with --snr-db DB|off / --noise-seed.
noise:
  snr_db: 30.0                     # peak-referenced receiver SNR (dB); null -> noiseless
  seed: 0

# Speculative TX-location sweep for grid-search-mgs (ignored by plain mgs).
grid_search:
  z:        {min: 0.15, max: 0.80, num: 64}
  x_center: {min: -0.15, max: 0.15, num: 48}
  aperture: {width: 0.072, dx: 0.00025}
  seed: 0
  gs_overrides: {max_iters: 800}
