# RECEIVER-SIZE STUDY, FULL pass (2 mm grid, base.yml), UNIFORM LEVEL, 120 mm RX:
# the plain weighted-MSE objective, the control for rx177_level_w120_pp1.yml (the same
# solve with the excess-power penalty inside the descent). Row 177, RX x = 95..215 mm
# (0.5 mm pitch), right edge just past the curving beam (peak at x = 209 mm).
# Frame: z_sim = (177 - z) mm, x_sim = (x - 155) mm.
#
# Solver: the MGS with ONE uniform plate level fitted with the phase
# (gerchberg_saxton.amplitude: level), power-matched start, no cap; 6000 iterations,
# one tone, backprop start (base.yml). Same settings as the coarse level sweep
# rx177_level_w120_coarse.yml, on the full 2 mm grid.
# amplitude_scale = 1 / max|V(300 GHz)| on this RX (the RX peak -> 1.0).

base_config: ../base.yml

measured:
  data_file: ~/Desktop/experiments/topt_spectra.csv
  tx_aperture: {left: {x: 85, z: -65}, right: {x: 185, z: -65}}
  rx_aperture: {left: {x: 95, z: 177}, right: {x: 215, z: 177}}
  amplitude_scale: 0.0081728    # 1 / max|V| on this RX (peak 122.356 at x = 209 mm)

gerchberg_saxton:
  amplitude: level
  max_iters: 6000

output: {run_name: rxsize_rx177_level_w120}
