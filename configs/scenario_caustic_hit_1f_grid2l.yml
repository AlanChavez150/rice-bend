# CAMPAIGN BASE CONFIG, caustic beam: a SINGLE frequency (300 GHz, the design center)
# on the HIGH-RESOLUTION 327x151 grid_search (49,377 candidate spots, the grid of
# scenario_caustic_hit_pm5.yml; ~2λ cells at 300 GHz: z step 1.99 mm, x step 2.00 mm).
# mgs-study derives both campaign series from this file: --study frequency replaces
# the tone list with its combs about 300 GHz, --study snr sets the noise level. So
# the single tone and the 30 dB below are what a plain mgs or grid-search-mgs run
# uses. What the file fixes for every point of a series:
#
# - the receiver: the lambda/2 array sits ON the solver grid
#   (rx_aperture.grid_stride: 2) instead of being interpolated onto it
#   (rx_aperture.dx), so the solver's target is the field the elements sampled and
#   nothing else;
# - the start: gerchberg_saxton.init: backprop, the phase of the back-propagated
#   measurement in place of a random draw. The single solve at the true TX converged
#   after 873 iterations at 30 dB where the random start needed 1488 (both measured
#   under the earlier -1e-8 stop threshold);
# - one solver setting for every solve: gerchberg_saxton.max_iters 3000 and
#   convergence_threshold -1e-10, with no grid_search.gs_overrides, so every
#   candidate of the sweep gets exactly one solve from that start under the same
#   settings as a plain mgs run, --true-mgs and scripts/true_tx_table.py.
#
# It began as a copy of configs/archive/scenario_caustic_hit_1f.yml (the 64x48 grid,
# the interpolated receiver, the legacy start).
# configs/archive/scenario_caustic_hit_1f_grid2l_lambda20.yml was its dense-RX
# control; it is archived with the lambda/20 receiver, the legacy start and the
# earlier solver settings (5000 cap, -1e-8 stop, the sweep at 800 through
# gs_overrides), so the pair no longer differs in the receiver alone.
#
# Scenario: caustic beam HITS the RX aperture (big arc curves into the window).
# RX window: centered x=0, width 0.04 m. RX at z=0; TX projects -Z. TX width 0.072 m
# (the caustic support), height z=0.3. RX array at lambda/2 on the solver grid (80
# elements, every 2nd scene x sample in the window); TX plate sampled at lambda/20
# (1440 samples); 30 dB receiver noise. Verified (300 GHz): big-arc
# caustic (a=0.8): launches ~-0.10, curves into the RX. beam_peak_x=+0.0031, FWHM=0.0178,
# rx_peak/peak=1.000, energy_frac_in_rx=0.840 -> HIT (the peak is not centred in the
# ±0.02 m RX window: it sits 3.9 mm short of the geometric caustic at +0.0070)

sim_scene:
  x_min: -0.3
  x_max: 0.3
  z_min: 0.0
  z_max: 0.85
  spacing: 0.00025

tx_aperture:
  x_min: -0.137
  x_max: -0.065
  z: 0.3
  dx: 0.0000499654         # lambda/20 at 300 GHz: int(width/dx) = 1440 samples across the plate
  beam:
    type: caustic
    trajectory: [0.8, 0.0, -0.065]   # x(d)=a*d^2+b*d+c; c offsets the beam laterally

rx_aperture:
  x_center: 0.0
  width: 0.04
  grid_stride: 2           # elements ON the solver grid: every 2nd scene x sample in the window, 80
                           # elements at 0.5002 mm pitch (lambda/2 at 300 GHz to 0.1 %; lambda =
                           # 0.999308 mm), one physical array for every tone. The field is sampled at
                           # those points directly and the loss is scored only there. `dx` instead
                           # would put the elements on their own axis and interpolate them onto the
                           # 0.25 mm grid, leaving the solver's target about -18 dB off the true field

plot_path: scenario_caustic_hit_1f_grid2l.png

# Single frequency: the joint solve reduces to the plain single-frequency MGS.
frequencies: [300.0e9]

gerchberg_saxton:
  init: backprop           # start every solve from the DATA, not from a random draw: the reference
                           # tone's measurement back-propagated to the candidate plane, its phase
                           # unwrapped where the plate lights the RX window and continued at
                           # constant slope where it does not; with several tones the absolute
                           # offset is then scanned over the comb's TRUE period. The legacy start
                           # (warm_start, the default) scans a range that is a period only when
                           # f_ref/df is an integer, and takes its phase from a random-start solve
                           # of the reference tone, which is not unique where part of the beam
                           # misses the RX window
  max_iters: 3000          # the cap of EVERY solve: grid_search has no gs_overrides, so the sweep
                           # (each candidate solved once), mgs, --true-mgs and
                           # scripts/true_tx_table.py all solve under the same settings
  convergence_count: 10
  convergence_threshold: -1.0e-10
  lr0: 0.05
  bt_shrink: 0.5
  bt_tries: 8
  seed: 0
  history_stride: 50

output:
  output_dir: results
  run_name: scenario_caustic_hit_1f_grid2l
  save_run: true
  save_scene_fields: false
  save_gs_history: false

# Receiver noise on the simulated RX measurement (complex AWGN per RX element, one
# floor for all antennas and tones). Override with --snr-db DB|off / --noise-seed.
noise:
  snr_db: 30.0                     # peak-referenced receiver SNR (dB); null -> noiseless
  seed: 0

# Speculative TX-location sweep for grid-search-mgs (ignored by plain mgs).
grid_search:
  z:        {min: 0.15, max: 0.80, num: 327}
  x_center: {min: -0.15, max: 0.15, num: 151}
  aperture: {width: 0.072, dx: 0.00025}
  seed: 0
