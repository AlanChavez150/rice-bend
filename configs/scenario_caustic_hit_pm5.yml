# Three frequencies, center 300 GHz ±5%, on the fine 327x151 grid.
#
# Kept as the input of the Rust benchmark: rust/python/bench.py times the two engines
# on this file's three-tone comb, and the rust side of that timing includes the
# engine's OWN warm start. So this file keeps the LEGACY start (no
# gerchberg_saxton.init, so warm_start, and no grid_search.refine): the data-driven
# start is computed in python for both engines, and with it the start would drop
# out of the comparison. The receiver is the campaign's, the lambda/2 array ON the
# solver grid (rx_aperture.grid_stride: 2). For a study use a campaign base config
# (scenario_{caustic,bessel,focus}_hit_1f_grid2l.yml): mgs-study builds its combs,
# ±5 % among them, from those.
#
# This was frequency-comparison case 2 of 3. The other two are archived and keep the
# interpolated receiver (configs/archive/scenario_caustic_hit_1f.yml, single
# frequency, and configs/archive/scenario_caustic_hit_pm10.yml, ±10%; both on the
# original 64x48 grid), so the frequency list is no longer the only variable across
# the three.
#
# Scenario: caustic beam HITS the RX aperture (big arc curves into the window).
# RX window: centered x=0, width 0.04 m. RX at z=0; TX projects -Z. TX width 0.072 m
# (the caustic support), height z=0.3. RX array at lambda/2 on the solver grid (80
# elements, every 2nd scene x sample in the window, one physical array for all three
# tones); TX plate sampled at lambda/20 (1440 samples); 30 dB
# receiver noise. Verified (300 GHz): big-arc caustic (a=0.8): launches ~-0.10, curves
# into the RX. beam_peak_x=+0.0031, FWHM=0.0178, rx_peak/peak=1.000,
# energy_frac_in_rx=0.840 -> HIT (the peak is not centred in the ±0.02 m RX window:
# it sits 3.9 mm short of the geometric caustic at +0.0070)
# Dense 327x151 grid_search (49,377 candidate spots; ~2λ cells: z step 1.99 mm,
# x step 2.00 mm at 300 GHz; a nested refinement of the earlier 164x76 grid).

sim_scene:
  x_min: -0.3
  x_max: 0.3
  z_min: 0.0
  z_max: 0.85
  spacing: 0.00025

tx_aperture:
  x_min: -0.137
  x_max: -0.065
  z: 0.3
  dx: 0.0000499654         # lambda/20 at 300 GHz: int(width/dx) = 1440 samples across the plate
  beam:
    type: caustic
    trajectory: [0.8, 0.0, -0.065]   # x(d)=a*d^2+b*d+c; c offsets the beam laterally

rx_aperture:
  x_center: 0.0
  width: 0.04
  grid_stride: 2           # elements ON the solver grid: every 2nd scene x sample in the window, 80
                           # elements at 0.5002 mm pitch (lambda/2 at 300 GHz to 0.1 %; lambda =
                           # 0.999308 mm), one physical array for every tone. The field is sampled at
                           # those points directly and the loss is scored only there. `dx` instead
                           # would put the elements on their own axis and interpolate them onto the
                           # 0.25 mm grid, leaving the solver's target about -18 dB off the true field

plot_path: scenario_caustic_hit_pm5.png

# 300 GHz ±5%: ONE JOINT solve — a single delay plate fitted against all three
# frequencies at once (warm-started; loss = mean of the per-frequency losses).
frequencies: [285.0e9, 300.0e9, 315.0e9]

gerchberg_saxton:
  max_iters: 800
  convergence_count: 10
  convergence_threshold: -1.0e-8
  lr0: 0.05
  bt_shrink: 0.5
  bt_tries: 8
  seed: 0
  history_stride: 50

output:
  output_dir: results
  run_name: scenario_caustic_hit_pm5
  save_run: true
  save_scene_fields: false
  save_gs_history: false

# Receiver noise on the simulated RX measurement (complex AWGN per RX element, one
# floor for all antennas and tones). Override with --snr-db DB|off / --noise-seed.
noise:
  snr_db: 30.0                     # peak-referenced receiver SNR (dB); null -> noiseless
  seed: 0

# Speculative TX-location sweep for grid-search-mgs (ignored by plain mgs).
grid_search:
  z:        {min: 0.15, max: 0.80, num: 327}
  x_center: {min: -0.15, max: 0.15, num: 151}
  aperture: {width: 0.072, dx: 0.00025}
  seed: 0
  gs_overrides: {max_iters: 800}
