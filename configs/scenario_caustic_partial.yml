# Test scenario: Caustic "partial" — TX aperture window fixed at [-0.132, 0.000]; the beam
# trajectory (c=-0.043) is offset independently of the aperture, so the aperture captures an
# off-centre slice of the beam rather than the whole transmitter moving together.
# RX window: centered x=0, width 0.04 m. Dense 48x48 grid_search (2304 candidate spots).

sim_scene:
  x_min: -0.3
  x_max: 0.3
  z_min: 0.0
  z_max: 0.85
  spacing: 0.00025

tx_aperture:
  x_min: -0.132
  x_max: 0.0
  z: 0.3
  dx: 0.00025
  beam:
    type: caustic
    trajectory: [0.8, 0.0, -0.043]   # x(d)=a*d^2+b*d+c; c offsets the beam laterally

rx_aperture:
  x_center: 0.0
  width: 0.04
  dx: null

plot_path: scenario_caustic_partial.png

# Frequencies (Hz) the solvers run at. More than one means ONE JOINT solve: a single
# shared aperture profile fitted against every frequency at once (one delay
# plate whose phase scales with frequency; loss = mean of the per-frequency
# losses), written to one flat results/<run_name>/ with joint + per-frequency plots.
frequencies: [100.0e9, 110.0e9, 120.0e9, 130.0e9, 140.0e9, 150.0e9, 160.0e9, 170.0e9, 180.0e9, 190.0e9]

gerchberg_saxton:
  max_iters: 800
  convergence_count: 10
  convergence_threshold: -1.0e-8
  lr0: 0.05
  bt_shrink: 0.5
  bt_tries: 8
  seed: 0
  history_stride: 50

output:
  output_dir: results
  run_name: scenario_caustic_partial
  save_run: true
  save_scene_fields: false
  save_gs_history: false

# Speculative TX-location sweep for grid-search-mgs (ignored by plain mgs).
grid_search:
  z:        {min: 0.15, max: 0.80, num: 48}
  x_center: {min: -0.15, max: 0.15, num: 48}
  aperture: {width: 0.10, dx: 0.00025}
  seed: 0
  gs_overrides: {max_iters: 800}
