# Test scenario: Directional beam LARGER than the RX aperture, HITS it (centered)
# RX window: centered x=0, width 0.065 m. RX at z=0; TX projects -Z. Shared symmetric
# scene across all scenarios. TX width 0.110 m, height z=0.75. Verified (150 GHz):
# beam_peak_x=-0.027, FWHM=0.099 (> rx 0.065), rx_peak/peak=1.00 -> HIT

sim_scene:
  x_min: -0.3
  x_max: 0.3
  z_min: 0.0
  z_max: 0.85
  spacing: 0.00025

tx_aperture:
  x_min: -0.055
  x_max: 0.055
  z: 0.75
  dx: 0.00025
  beam:
    type: directional
    steer_angle_deg: 0

rx_aperture:
  x_center: 0.0
  width: 0.065
  dx: null

plot_path: scenario_directional_larger.png

# Frequencies (Hz) to run the grid search at. More than one runs the whole sweep
# independently per frequency; results land in results/<run_name>/freq_<GHz>/ and a
# top-level residual_scatter_3d.png stacks the candidate residuals along frequency.
frequencies: [100.0e9, 110.0e9, 120.0e9, 130.0e9, 140.0e9, 150.0e9, 160.0e9, 170.0e9, 180.0e9, 190.0e9]

gerchberg_saxton:
  max_iters: 800
  convergence_count: 10
  convergence_threshold: -1.0e-8
  lr0: 0.05
  bt_shrink: 0.5
  bt_tries: 8
  seed: 0
  history_stride: 50

output:
  output_dir: results
  run_name: scenario_directional_larger
  save_run: true
  save_scene_fields: false
  save_gs_history: false

# Speculative TX-location sweep for grid-search-mgs (ignored by plain mgs).
grid_search:
  z:        {min: 0.15, max: 0.80, num: 12}
  x_center: {min: -0.15, max: 0.15, num: 12}
  aperture: {width: 0.10, dx: 0.00025}
  seed: 0
  gs_overrides: {max_iters: 800}
