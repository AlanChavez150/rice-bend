# Test scenario: Caustic beam HITS the RX aperture (big arc curves into the window)
#
# Kept for scripts/characterize.sh: check 2 runs this file pinned to 300 GHz, the
# net's one full-resolution single solve. It therefore keeps the LEGACY start (no
# gerchberg_saxton.init, so warm_start): the check pins the solver the earlier
# results were made with. The receiver is the campaign's, the lambda/2 array ON the
# solver grid (rx_aperture.grid_stride: 2). For the campaign itself use
# scenario_caustic_hit_1f_grid2l.yml, which adds the data-driven start.
#
# RX window: centered x=0, width 0.04 m. RX at z=0; TX projects -Z. Shared symmetric
# scene across all scenarios. TX width 0.072 m (the caustic support), height z=0.3.
# 300 GHz centre (ten-tone comb, 200-380 GHz); RX array at lambda/2 on the solver grid (80
# elements, every 2nd scene x sample in the window, one physical array for every tone); TX
# plate sampled at lambda/20 (1440 samples); 30 dB receiver noise.
# Verified (300 GHz): big-arc caustic (a=0.8): launches ~-0.10, curves into the RX.
# beam_peak_x=+0.0031, FWHM=0.0178, rx_peak/peak=1.000, energy_frac_in_rx=0.840 -> HIT. The peak
# is not centred in the ±0.02 m RX window: the main lobe sits on the lit (-x) side of the
# geometric caustic (+0.0070 at the RX plane), 3.9 mm short of it. Across the comb: beam_peak_x=+0.0019,
# FWHM=0.0240, energy_frac_in_rx=0.840 at 200 GHz; +0.0031, 0.0193, 0.837 at 380 GHz.
# Dense 64x48 grid_search (3072 candidate spots); see scenario_caustic_hit_sparse.yml for the
# 12x12 grid (that file stays on the interpolated receiver, rx_aperture.dx).

sim_scene:
  x_min: -0.3
  x_max: 0.3
  z_min: 0.0
  z_max: 0.85
  spacing: 0.00025

tx_aperture:
  x_min: -0.137
  x_max: -0.065
  z: 0.3
  dx: 0.0000499654         # lambda/20 at 300 GHz: int(width/dx) = 1440 samples across the plate
  beam:
    type: caustic
    trajectory: [0.8, 0.0, -0.065]   # x(d)=a*d^2+b*d+c; c offsets the beam laterally

rx_aperture:
  x_center: 0.0
  width: 0.04
  grid_stride: 2           # elements ON the solver grid: every 2nd scene x sample in the window, 80
                           # elements at 0.5002 mm pitch (lambda/2 at 300 GHz to 0.1 %; lambda =
                           # 0.999308 mm), one physical array for every tone. The field is sampled at
                           # those points directly and the loss is scored only there. `dx` instead
                           # would put the elements on their own axis and interpolate them onto the
                           # 0.25 mm grid, leaving the solver's target about -18 dB off the true field

plot_path: scenario_caustic_hit.png

# Frequencies (Hz) the solvers run at. More than one means ONE JOINT solve: a single
# shared aperture profile fitted against every frequency at once (one delay
# plate whose phase scales with frequency; loss = mean of the per-frequency
# losses), written to one flat results/<run_name>/ with joint + per-frequency plots.
frequencies: [200.0e9, 220.0e9, 240.0e9, 260.0e9, 280.0e9, 300.0e9, 320.0e9, 340.0e9, 360.0e9, 380.0e9]

gerchberg_saxton:
  max_iters: 800
  convergence_count: 10
  convergence_threshold: -1.0e-8
  lr0: 0.05
  bt_shrink: 0.5
  bt_tries: 8
  seed: 0
  history_stride: 50

output:
  output_dir: results
  run_name: scenario_caustic_hit
  save_run: true
  save_scene_fields: false
  save_gs_history: false

# Receiver noise on the simulated RX measurement (complex AWGN per RX element, one
# floor for all antennas and tones). Override with --snr-db DB|off / --noise-seed.
noise:
  snr_db: 30.0                     # peak-referenced receiver SNR (dB); null -> noiseless
  seed: 0

# Speculative TX-location sweep for grid-search-mgs (ignored by plain mgs).
grid_search:
  z:        {min: 0.15, max: 0.80, num: 64}
  x_center: {min: -0.15, max: 0.15, num: 48}
  aperture: {width: 0.072, dx: 0.00025}
  seed: 0
  gs_overrides: {max_iters: 800}
