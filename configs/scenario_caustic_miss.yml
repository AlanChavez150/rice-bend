# Test scenario: Caustic beam MISSES the RX aperture (same big-arc beam as caustic_hit, TX moved right)
# RX window: centered x=0, width 0.04 m. RX at z=0; TX projects -Z. Shared symmetric
# scene across all scenarios. TX width 0.132 m, height z=0.3. Verified (150 GHz):
# same big-arc beam as caustic_hit (a=0.8) translated right via c=0.05: beam_peak_x=+0.115, FWHM=0.030 -> MISS (peak +0.115 lies outside the ±0.02 m RX window)

sim_scene:
  x_min: -0.3
  x_max: 0.3
  z_min: 0.0
  z_max: 0.85
  spacing: 0.00025

tx_aperture:
  x_min: -0.052
  x_max: 0.08
  z: 0.3
  dx: 0.00025
  beam:
    type: caustic
    trajectory: [0.8, 0.0, 0.05]   # x(d)=a*d^2+b*d+c; c offsets the beam laterally

rx_aperture:
  x_center: 0.0
  width: 0.04
  dx: null

plot_path: scenario_caustic_miss.png

# Frequencies (Hz) the solvers run at. More than one means ONE JOINT solve: a single
# shared aperture profile fitted against every frequency at once (delay plate vs
# achromatic mask is gerchberg_saxton.phase_model; loss = mean of the per-frequency
# losses), written to one flat results/<run_name>/ with joint + per-frequency plots.
frequencies: [100.0e9, 110.0e9, 120.0e9, 130.0e9, 140.0e9, 150.0e9, 160.0e9, 170.0e9, 180.0e9, 190.0e9]

gerchberg_saxton:
  max_iters: 800
  convergence_count: 10
  convergence_threshold: -1.0e-8
  lr0: 0.05
  bt_shrink: 0.5
  bt_tries: 8
  seed: 0
  history_stride: 50

output:
  output_dir: results
  run_name: scenario_caustic_miss
  save_run: true
  save_scene_fields: false
  save_gs_history: false

# Speculative TX-location sweep for grid-search-mgs (ignored by plain mgs).
grid_search:
  z:        {min: 0.15, max: 0.80, num: 48}
  x_center: {min: -0.15, max: 0.15, num: 48}
  aperture: {width: 0.10, dx: 0.00025}
  seed: 0
  gs_overrides: {max_iters: 800}
