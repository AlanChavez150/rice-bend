[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rice-bend"
version = "0.1.0"
description = "Phase retrieval of mm-wave beams via a modified Gerchberg-Saxton algorithm"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    # cumulative_trapezoid / trapezoid (the numpy-2.0-safe spellings) landed in 1.6
    "scipy>=1.6",
    "matplotlib",
    "coloredlogs",
    "h5py",
    "pyyaml",
    "pydantic>=2",
]

[project.scripts]
mgs = "rice_bend.mgs:main"
mgs-animate = "rice_bend.animate:main"
grid-search-mgs = "rice_bend.grid_search:main"

[tool.setuptools.packages.find]
where = ["src"]
